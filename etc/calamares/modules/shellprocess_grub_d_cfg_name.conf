---
## grubcfg writes /etc/default/grub.d/00calamares, but grub-install and grub-mkconfig
## only read grub.d/*.cfg. Rename right after grubcfg so every later grub-install sees
## it (e.g. GRUB_ENABLE_CRYPTODISK for /boot inside LUKS).
dontChroot: false
timeout: 120
script:
    - mv /etc/default/grub.d/00calamares /etc/default/grub.d/00calamares.cfg
